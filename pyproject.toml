[project]
name = "stokify"
version = "0.0.0"
description = "Demo the transpiler feature"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "landmanbester", email = "lbester@sarao.ac.za" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "hip-cargo[monitoring]",
]

# Lightweight install (default):  pip install stokify
#     Only pulls hip-cargo + typer. Suitable for cab consumers (e.g. stimela)
#     and for running commands via container fallback. Generated CLI wrappers
#     lazy-import core/, so when heavy deps are missing the wrapper drops into
#     run_in_container() automatically.
# Full install:                    pip install stokify[full]
#     Adds the heavy runtime deps that core/ implementations need to execute
#     natively. Add new deps to the "full" extra below as you grow core/.
[project.optional-dependencies]
# Heavy scientific stack — needed to RUN the synthetic pipeline natively.
# A real transpiled package keeps these in the per-step container image, not here
# (RFC §9.5). For this in-process local demo we install `.[full]`.
full = [
    "xarray>=2024.1.0",
    "numpy>=1.26",
    "zarr>=2.17,<3",
]

# Local demonstrator: pull hip-cargo (with the unreleased apis-branch monitoring
# and progress APIs) directly from the working checkout rather than PyPI.
[tool.uv.sources]
hip-cargo = { path = "../hip-cargo", editable = true }

[project.urls]
Homepage = "https://github.com/landmanbester/stokify"
Repository = "https://github.com/landmanbester/stokify"
"Bug Tracker" = "https://github.com/landmanbester/stokify/issues"

[project.scripts]
stokify = "stokify.cli:app"

[build-system]
# NOTE: This uv_build constraint is intentionally aligned with hip-cargo's own pyproject.toml.
# If you bump uv_build in hip-cargo, update this template constraint to match.
requires = ["uv_build>=0.8.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take more time to run",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "tbump>=6.11.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
    "bandit>=1.7.9",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
