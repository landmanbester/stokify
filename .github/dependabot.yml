version: 2
updates:
  # NOTE: the uv ecosystem is intentionally NOT monitored while hip-cargo is a
  # ../hip-cargo path source ([tool.uv.sources]) — dependabot cannot resolve it
  # and every update run fails. Re-enable once stokify depends on a released
  # hip-cargo from PyPI.

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
