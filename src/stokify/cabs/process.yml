cabs:
  process:
    flavour: python
    command: stokify.core.process.process
    name: process
    info:
      Transform coherencies into image-ready Stokes visibilities.
    inputs:
      input-data:
        info:
          Upstream dataset directory (zarr).
        dtype: Directory
        required: true
        policies:
          positional: true
      memory-mode:
        info:
          'Memory mode: greedy (plasma-resident) or conservative (store-backed).'
        choices:
        - greedy
        - conservative
        default: greedy
      n-iterations:
        info:
          Number of synthetic solver iterations.
        dtype: int
        default: 10
    outputs:
      output:
        dtype: Directory
        info:
          Output dataset directory (zarr).
        required: true
        mkdir: true
